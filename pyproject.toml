[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bybit-l2-feasibility"
version = "0.1.0"
description = "Pre-contract technical feasibility demo: Bybit USDT-perp L2 reconstruction, order flow / CVD and an auditable signal state machine (research only, no profitability claims)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
bybit-demo = "bybit_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_data: requires the real downloaded Bybit sample under data/raw (skipped if absent)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "TID"]
ignore = [
    "PLR0913",  # explicit, injected dependencies are preferred over hidden globals
    "PLR2004",  # magic values in tests / documented constants
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/bybit_demo", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["bybit_demo"]
branch = true
